[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "aiosmtplib>=3.0.0",
    "alembic>=1.18.4",
    "bcrypt>=4.2.0",
    "cos-python-sdk-v5>=1.9.41",
    "fastapi>=0.128.0",
    "filelock>=3.24.3",
    "greenlet>=3.0.0",
    "httpx>=0.28.1",
    "openai>=2.16.0",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "PyJWT>=2.9.0",
    "pymysql>=1.1.2",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "redis>=7.1.1",
    "sqlalchemy>=2.0.46",
    "uvicorn[standard]>=0.40.0",
    "starlette-admin>=0.14.0",
    "itsdangerous>=2.2.0",
    "tzdata>=2025.1",
    "types-pyyaml>=6.0.12.20250915",
    "json-repair>=0.58.7",
]

[[tool.uv.index]]
name = "douban"
url = "https://pypi.doubanio.com/simple/"
default = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.14",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
